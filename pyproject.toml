[project]
name = "nlpercep-analysis"
version = "0.1.0"
description = "Theory of Mind as the Missing Mechanism in Social Perception NLP - Analysis pipeline for EXIST 2025"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "anthropic>=0.109.1",
    "openai>=2.41.1",
    "python-dotenv>=1.2.2",
    "pyarrow>=24.0.0",
    "tqdm>=4.68.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlpercep", "src/llm_audit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
